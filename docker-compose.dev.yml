version: '3.8'

services:
  # Primary Development PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: coreerp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-core_erp}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-core_erp}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated Isolated Test Database for Vitest integration tests
  postgres-test:
    image: postgres:16-alpine
    container_name: coreerp-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_test_user
      POSTGRES_PASSWORD: erp_test_password
      POSTGRES_DB: core_erp_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_test_user -d core_erp_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated Prisma Shadow Database for local migration authoring (`prisma migrate dev`)
  # Start explicitly when authoring migrations:
  #   docker compose -f docker-compose.dev.yml --profile shadow up -d postgres-shadow
  postgres-shadow:
    image: postgres:16-alpine
    container_name: coreerp-postgres-shadow
    profiles: ["shadow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHADOW_POSTGRES_USER:-erp_shadow_user}
      POSTGRES_PASSWORD: ${SHADOW_POSTGRES_PASSWORD:-erp_shadow_password_dev}
      POSTGRES_DB: ${SHADOW_POSTGRES_DB:-core_erp_shadow}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5436:5432"
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHADOW_POSTGRES_USER:-erp_shadow_user} -d ${SHADOW_POSTGRES_DB:-core_erp_shadow}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  postgres_test_data:
  postgres_shadow_data:
