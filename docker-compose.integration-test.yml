services:
  # Dedicated Isolated PostgreSQL 16 Database for CoreERP Concurrency Integration Tests
  postgres-integration-test:
    image: postgres:16-alpine
    container_name: coreerp-postgres-integration-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_integration_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.integration-test}
      POSTGRES_DB: core_erp_integration_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - postgres_integration_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_integration_user -d core_erp_integration_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_integration_test_data:
